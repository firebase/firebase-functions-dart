name: native_reference
description: >-
  Fixture declaring a language version that supports native build hooks, so the
  generated manifest is expected to target the dart build cli bundle.
publish_to: none

# Not a workspace member: a `^3.13.0` constraint there would block
# `dart pub get` for the whole repository on older SDKs.

environment:
  sdk: ^3.13.0

dependencies:
  firebase_functions: ^0.8.0-wip

dev_dependencies:
  build_runner: ^2.10.5
  dart_flutter_team_lints: ^3.5.2
  lints: ^6.0.0

dependency_overrides:
  firebase_functions:
    path: ../../..
